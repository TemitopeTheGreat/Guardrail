<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Guardrail Financial</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(rgba(52,211,153,.015) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(52,211,153,.015) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .tab-active   { border-bottom: 2px solid #34D399; color: #fff; }
  .tab-inactive { border-bottom: 2px solid transparent; color: #94a3b8; }

  .progress-bar { height: 6px; border-radius: 9999px; transition: width .5s ease; }
  input, select { font-family: 'Inter', sans-serif; }

<body class="bg-slate-950 text-slate-300 min-h-screen">

<!-- ── NAV ─────────────────────────────────────────────────────────────────── -->
<nav class="sticky top-0 z-50 bg-slate-950/95 backdrop-blur-lg border-b border-slate-800/60">
  <div class="max-w-screen-xl mx-auto px-6 flex items-stretch h-16 gap-6">

      </svg>
      <div>

        <div class="mono text-emerald-400 text-xs font-semibold tracking-widest">Financial</div>

    <div class="flex-1 flex items-stretch overflow-x-auto">

      <button data-tab="audit"     onclick="switchTab('audit')"     class="tab-btn tab-inactive px-4 text-sm font-semibold whitespace-nowrap transition-colors">Audit &amp; Clean</button>
      <button data-tab="ledger"    onclick="switchTab('ledger')"    class="tab-btn tab-inactive px-4 text-sm font-semibold whitespace-nowrap transition-colors">Ledger</button>
      <button data-tab="cashflow"  onclick="switchTab('cashflow')"  class="tab-btn tab-inactive px-4 text-sm font-semibold whitespace-nowrap transition-colors">Cash Flow</button>
      <button data-tab="balance"   onclick="switchTab('balance')"   class="tab-btn tab-inactive px-4 text-sm font-semibold whitespace-nowrap transition-colors">Balance Sheet</button>

<script type="module">
import { supabaseClient, requireAuth, getProfile, logout } from '/js/auth.js';

let userId, accessToken;
let latestAudit  = null;
let transactions = [];
let goals        = [];

// ── FORMATTERS ───────────────────────────────────────────────────────────────
function formatNGN(n) {
  const v = Number(n);
  if (!isFinite(v)) return 'NGN 0.00';
  return 'NGN ' + v.toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function scoreHex(s) { return +s >= 90 ? '#34D399' : +s >= 70 ? '#FBBF24' : '#F87171'; }
function scoreCls(s) { return +s >= 90 ? 'text-emerald-400' : +s >= 70 ? 'text-amber-400' : 'text-red-400'; }
function fmtDate(d) { try { return new Date(d).toLocaleDateString('en-GB'); } catch { return d || '—'; } }
function monthLabel(ym) { const [y,m] = ym.split('-'); return new Date(+y,+m-1).toLocaleDateString('en-GB',{month:'short',year:'numeric'}); }

// ── EMPTY STATE ───────────────────────────────────────────────────────────────
function emptyState(msg='No audit data yet', sub='Upload your first transaction file to get started') {
  return `<div class="flex flex-col items-center justify-center py-20 text-center">
    <svg class="mb-5 opacity-20" width="56" height="56" fill="none" viewBox="0 0 56 56">
      <rect x="8" y="14" width="40" height="32" rx="4" stroke="#34D399" stroke-width="2"/>
      <path d="M20 28h16M20 35h10" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <p class="text-white font-bold text-xl mb-2">${msg}</p>
    <p class="text-slate-500 text-sm mb-6 max-w-xs">${sub}</p>
    <button onclick="switchTab('audit')" class="bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-sm transition-colors">Upload first file</button>
  </div>`;
}

// ── TAB SWITCHING ─────────────────────────────────────────────────────────────
window.switchTab = function(name) {
  document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('hidden'));
  document.getElementById('tab-' + name)?.classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const on = btn.dataset.tab === name;
    btn.className = `tab-btn ${on ? 'tab-active' : 'tab-inactive'} px-4 text-sm font-semibold whitespace-nowrap transition-colors`;
  });
};

// ── DATA HELPERS ──────────────────────────────────────────────────────────────
// Fetch every transaction row for an audit — Supabase caps a single select at
// 1000 rows, so page through with .range() until a short page tells us we're done.
// (No row limit per the audit spec — large uploads must show their full ledger.)
async function fetchAllTransactions(auditId) {
  const PAGE = 1000;
  let all = [], from = 0;
  for (;;) {
    const { data } = await supabaseClient.from('transactions').select('*')
      .eq('audit_id', auditId).order('row_number').range(from, from + PAGE - 1);
    all = all.concat(data || []);
    if (!data || data.length < PAGE) break;
    from += PAGE;
  }
  return all;
}

function computeTotals(txns) {
  const clean    = txns.filter(t => !t.is_flagged);
  const income   = clean.filter(t => Number(t.credit) > 0 && (t.financial_type === 'revenue' || !t.financial_type))
                        .reduce((s,t) => s + Number(t.credit), 0);
  const expenses = clean.filter(t => Number(t.debit)  > 0 && (t.financial_type === 'expense' || !t.financial_type))
                        .reduce((s,t) => s + Number(t.debit),  0);
  return { income, expenses, netWorth: income - expenses };
}
function groupByDebitCat(txns) {
  const m = {};
  txns.filter(t => !t.is_flagged && Number(t.debit)>0).forEach(t => { m[t.category||'other'] = (m[t.category||'other']||0)+Number(t.debit); });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function groupByCreditCat(txns) {
  const m = {};
  txns.filter(t => !t.is_flagged && Number(t.credit)>0).forEach(t => { m[t.category||'other'] = (m[t.category||'other']||0)+Number(t.credit); });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
// Builds an account-class ledger section for the cash flow tab
function buildLedger(txns, amtField) {
  const isDebit = amtField === 'debit';
  const col     = isDebit ? 'text-red-400' : 'text-emerald-400';
  const clean   = txns.filter(t => !t.is_flagged && Number(t[amtField]) > 0);
  if (!clean.length) return `<p class="text-slate-600 text-sm py-4">No transactions</p>`;
  const grouped = {};
  clean.forEach(t => {
    const cat = t.category || 'other';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(t);
  });
  return Object.entries(grouped)
    .sort((a,b) => b[1].reduce((s,t)=>s+Number(t[amtField]),0) - a[1].reduce((s,t)=>s+Number(t[amtField]),0))
    .map(([cat, rows]) => {
      const sub = rows.reduce((s,t)=>s+Number(t[amtField]),0);
      return `<div class="mb-5 last:mb-0">
        <div class="flex justify-between items-center py-2 border-b border-slate-700 mb-1">
          <span class="text-white font-bold text-sm capitalize">${cat}</span>
          <span class="mono font-bold text-sm ${col}">${formatNGN(sub)}</span>
        </div>
        ${rows.map(t=>`<div class="flex items-center py-1.5 border-b border-slate-800/40 text-xs">
          <span class="mono text-slate-500 w-20 shrink-0">${fmtDate(t.txn_date)}</span>
          <span class="text-slate-400 flex-1 truncate px-3">${t.description||'—'}</span>
          <span class="mono ${col} shrink-0">${formatNGN(Number(t[amtField]))}</span>
        </div>`).join('')}
      </div>`;
    }).join('');
}
function groupByMonth(txns) {
  const m = {};
  txns.filter(t=>t.txn_date).forEach(t => {
    const k = t.txn_date.slice(0,7);
    if (!m[k]) m[k] = {in:0,out:0};
    if (Number(t.credit)>0) m[k].in  += Number(t.credit);
    if (Number(t.debit)>0)  m[k].out += Number(t.debit);
  });
  return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));
}

// ── UI PRIMITIVES ─────────────────────────────────────────────────────────────
function metricCard(label, val, cls='text-white', sub='') {
  return `<div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
    <p class="text-xs uppercase tracking-widest text-slate-500 mb-3">${label}</p>
    <p class="text-2xl font-bold mono ${cls}">${val}</p>
    ${sub ? `<p class="text-xs text-slate-600 mt-1 truncate">${sub}</p>` : ''}
  </div>`;
}
function catBars(entries, total, col='#34D399') {
  if (!entries.length) return '<p class="text-slate-600 text-sm">No data</p>';
  const max = entries[0][1];
  return entries.map(([cat,amt]) => {
    const pct = total>0 ? ((amt/total)*100).toFixed(1) : 0;
    const w   = max>0   ? ((amt/max)*100).toFixed(1)   : 0;
    return `<div class="mb-3">
      <div class="flex justify-between text-xs mb-1.5">
        <span class="text-slate-300 font-medium capitalize">${cat}</span>
        <span class="mono text-slate-400">${formatNGN(amt)} <span class="text-slate-600">${pct}%</span></span>
      </div>
      <div class="bg-slate-800 rounded-full h-1.5">
        <div style="width:${w}%;background:${col}" class="h-1.5 rounded-full transition-all duration-500"></div>
      </div>
    </div>`;
  }).join('');
}

// ── RENDER: OVERVIEW ─────────────────────────────────────────────────────────
function renderOverview() {
  const { income, expenses, netWorth } = computeTotals(transactions);
  const score = Number(latestAudit?.audit_score || 0);

  const netProfit = income - expenses;
  document.getElementById('overview-cards').innerHTML = !latestAudit
    ? metricCard('Total Revenue','—') + metricCard('Total Expenses','—') + metricCard('Net Profit','—') + metricCard('Audit Score','—')
    : metricCard('Total Revenue',  formatNGN(income),   'text-emerald-400')
    + metricCard('Total Expenses', formatNGN(expenses), 'text-red-400')
    + metricCard(netProfit >= 0 ? 'Net Profit' : 'Net Loss', formatNGN(netProfit), netProfit>=0?'text-emerald-400':'text-red-400')
    + metricCard('Audit Score',    `${score}/100`,       scoreCls(score), latestAudit?.file_name||'');

  const spend = document.getElementById('spending-breakdown');
  spend.innerHTML = `<p class="text-slate-400 text-xs uppercase tracking-widest font-semibold mb-5">Spending by Category</p>`
    + (latestAudit ? catBars(groupByDebitCat(transactions), expenses) : emptyState('No data yet','Upload a file on the Audit tab'));

  const recent = [...transactions].sort((a,b)=>(b.row_number||0)-(a.row_number||0)).slice(0,10);
  const recEl = document.getElementById('recent-txns');
  if (!latestAudit) { recEl.innerHTML = emptyState('No transactions yet',''); return; }
  recEl.innerHTML = `<p class="text-slate-400 text-xs uppercase tracking-widest font-semibold mb-5">Recent Transactions</p>
    <div class="overflow-x-auto"><table class="w-full text-sm">
      <thead><tr class="border-b border-slate-800">
        <th class="text-left pb-3 text-xs text-slate-500 font-semibold uppercase tracking-wider pr-4">Date</th>
        <th class="text-left pb-3 text-xs text-slate-500 font-semibold uppercase tracking-wider pr-4">Description</th>
        <th class="text-left pb-3 text-xs text-slate-500 font-semibold uppercase tracking-wider pr-4">Category</th>
        <th class="text-right pb-3 text-xs text-slate-500 font-semibold uppercase tracking-wider pr-4">Amount</th>
        <th class="text-right pb-3 text-xs text-slate-500 font-semibold uppercase tracking-wider">Type</th>
      </tr></thead>
      <tbody>${recent.map(t => {
        const dr = Number(t.debit)>0;
        const am = dr ? Number(t.debit) : Number(t.credit);
        return `<tr class="border-b border-slate-800/50 hover:bg-slate-800/20 transition-colors">
          <td class="py-3 pr-4 mono text-xs text-slate-400 whitespace-nowrap">${fmtDate(t.txn_date)}</td>
          <td class="py-3 pr-4 text-slate-300 text-xs max-w-[180px] truncate">${t.description||'—'}${t.is_flagged?'<span class="ml-1 text-amber-400">⚑</span>':''}</td>
          <td class="py-3 pr-4"><span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full capitalize">${t.category||'—'}</span></td>
          <td class="py-3 pr-4 mono text-xs text-right ${dr?'text-red-400':'text-emerald-400'}">${formatNGN(am)}</td>
          <td class="py-3 mono text-xs text-right font-bold ${dr?'text-red-400':'text-emerald-400'}">${dr?'DR':'CR'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
}

window.dlReport = async function(id, btnEl) {
  const orig = btnEl?.textContent || '↓ PDF';
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '⟳ Generating…'; }
  try {
    // Always use a fresh token — the stored accessToken can expire
    const { data: { session: s } } = await supabaseClient.auth.getSession();
    const token = s?.access_token || accessToken;
    const r = await fetch('/api/generate-report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ audit_id: id }),
    });
    const d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.error || d.detail || `Server error ${r.status}`);
    if (!d.report_url) throw new Error('No download URL returned by server');
    const a = document.createElement('a');
    a.href = d.report_url; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch(e) {
    alert('Could not download report:\n' + e.message);
  } finally {
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = orig; }
  }
};

window.deleteAudit = async function(id, btnEl) {
  if (!confirm('Delete this audit and all its transactions? This cannot be undone.')) return;
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '…'; }
  try {
    const { error: t1 } = await supabaseClient.from('transactions').delete().eq('audit_id', id);
    if (t1) throw new Error(t1.message);
    const { error: t2 } = await supabaseClient.from('audits').delete().eq('id', id);
    if (t2) throw new Error(t2.message);
    if (latestAudit?.id === id) {
      latestAudit = null; transactions = [];
      renderOverview(); renderCashFlow(); renderBalanceSheet();
    }
    renderAuditTab();
  } catch(e) {
    alert('Delete failed: ' + e.message);
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = '🗑'; }
  }
};

// ── RENDER: BALANCE SHEET ─────────────────────────────────────────────────────
function renderBalanceSheet() {
  const el = document.getElementById('balance-content');
  if (!latestAudit) { el.innerHTML = emptyState(); return; }

  const clean        = transactions.filter(t => !t.is_flagged);
  const totalCredits = clean.reduce((s,t) => s + Number(t.credit||0), 0);
  const totalDebits  = clean.reduce((s,t) => s + Number(t.debit||0),  0);
  const cashPosition = totalCredits - totalDebits;

  const assetTxns       = clean.filter(t => t.financial_type === 'asset');
  const totalFixedAssets = assetTxns.reduce((s,t) => s + Number(t.debit||0), 0);
  const totalAssets      = cashPosition + totalFixedAssets;

  const liabTxns        = clean.filter(t => t.financial_type === 'liability_receipt');
  const totalLiabilities = liabTxns.reduce((s,t) => s + Number(t.credit||0), 0);

  const { income, expenses } = computeTotals(transactions);
  const equity   = income - expenses;
  const balances = Math.abs(totalAssets - (totalLiabilities + equity)) < 1;

  el.innerHTML = `<div class="max-w-2xl space-y-5">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
      <p class="text-slate-400 text-xs uppercase tracking-widest font-semibold mb-5">Assets</p>

        </div>
        ${assetTxns.length ? `<p class="text-slate-500 text-xs uppercase tracking-widest pt-3 pb-1 font-semibold">Fixed Assets</p>
          ${assetTxns.map(t=>`<div class="flex justify-between items-center py-1.5 border-b border-slate-800/30">
            <span class="text-slate-400 text-xs truncate max-w-xs">${t.description||'Asset purchase'}</span>

      <div class="flex justify-between items-center pt-2 border-t border-slate-700">
        <span class="text-white font-bold text-sm">Total Assets</span>
        <span class="mono font-bold text-emerald-400">${formatNGN(totalAssets)}</span>
      </div>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
      <p class="text-slate-400 text-xs uppercase tracking-widest font-semibold mb-5">Liabilities</p>
      ${liabTxns.length

            <span class="text-slate-400 text-sm truncate max-w-xs">${t.description||'Loan / liability'}</span>
            <span class="mono font-semibold text-red-400">${formatNGN(Number(t.credit||0))}</span>
          </div>`).join('')
        : '<p class="text-slate-600 text-sm py-2">No recorded liabilities</p>'}

        <span class="text-white font-bold text-sm">Total Liabilities</span>
        <span class="mono font-bold text-red-400">${formatNGN(totalLiabilities)}</span>
      </div>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
      <p class="text-slate-400 text-xs uppercase tracking-widest font-semibold mb-4">Equity</p>
      <div class="flex justify-between items-center py-2 border-b border-slate-800/50">
        <span class="text-slate-400 text-sm">Retained Earnings (Revenue − Expenses)</span>
        <span class="mono font-semibold ${equity>=0?'text-emerald-400':'text-red-400'}">${formatNGN(equity)}</span>

        <td class="py-3 px-4 text-sm">${item.obligation}</td>
        <td class="py-3 px-4 text-sm text-slate-400">${item.law}</td>
        <td class="py-3 px-4 text-sm text-emerald-400 font-semibold">${item.authority}</td>
      </tr>
    `).join('');
    const html = `
      <table class="w-full text-sm">
        <thead class="border-b border-slate-700 bg-slate-800/50"><tr><th class="text-left py-3 px-4 text-xs font-bold text-slate-400 uppercase">Deadline</th><th class="text-left py-3 px-4 text-xs font-bold text-slate-400 uppercase">Obligation</th><th class="text-left py-3 px-4 text-xs font-bold text-slate-400 uppercase">Law</th><th class="text-left py-3 px-4 text-xs font-bold text-slate-400 uppercase">Authority</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
    const calEl = document.getElementById('taxCalendar');
    if (calEl) calEl.innerHTML = html;
  }
}

// ── RENDER: GOALS ─────────────────────────────────────────────────────────────
function renderGoals() {
  const el = document.getElementById('goals-list');
  if (!goals.length) {
    el.innerHTML = `<div class="bg-slate-900 border border-slate-800 rounded-xl p-8 text-center"><p class="text-slate-500 text-sm">No active goals. Add one below.</p></div>`;
    return;
  }
  el.innerHTML = `<p class="text-slate-400 text-xs uppercase tracking-widest font-semibold mb-5">Active Goals</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      ${goals.map(g => {
        const lim  = Number(g.limit_amount);
        const spd  = Number(g.current_spend);
        const pct  = lim>0 ? Math.min((spd/lim)*100,100) : 0;
        const over = spd > lim;
        const bc   = pct>=100?'#F87171':pct>=80?'#FBBF24':'#34D399';
        const tl   = {expense_cap:'Expense Cap',savings_target:'Savings Target',revenue_target:'Revenue Target',profit_buffer:'Profit Buffer'}[g.goal_type]||g.goal_type;
        return `<div class="bg-slate-900 border ${over?'border-red-500/50':'border-slate-800'} rounded-xl p-5">
          <div class="flex justify-between items-start mb-3">
            <div><p class="text-white font-semibold text-sm mb-1">${g.label}</p>
              <span class="text-xs mono px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">${tl}</span></div>
            <button onclick="removeGoal('${g.id}')" class="text-slate-600 hover:text-red-400 transition-colors text-xl leading-none ml-2">×</button>
          </div>
          ${over?`<div class="bg-red-900/20 border border-red-500/30 rounded-lg px-3 py-2 mb-3"><p class="text-red-400 text-xs font-semibold">Guardrail breached by ${formatNGN(spd-lim)}</p></div>`:''}
          <div class="flex justify-between text-xs text-slate-500 mb-1.5"><span class="mono">${formatNGN(spd)}</span><span class="mono">${formatNGN(lim)}</span></div>
          <div class="bg-slate-800 rounded-full h-1.5 mb-2"><div style="width:${pct.toFixed(1)}%;background:${bc}" class="h-1.5 rounded-full transition-all duration-500"></div></div>
          <div class="flex justify-between text-xs text-slate-600"><span>${pct.toFixed(0)}% used</span><span class="capitalize">${g.period}</span></div>
        </div>`;
      }).join('')}
    </div>`;
}

window.handleAddGoal = async function(e) {
  e.preventDefault();
  const btn = document.getElementById('goals-submit-btn');
  const err = document.getElementById('goal-err');
  err.classList.add('hidden');
  btn.disabled=true; btn.textContent='Saving…';
  const { data, error } = await supabaseClient.from('goals').insert({
    user_id:      userId,
    label:        document.getElementById('goal-label').value.trim(),
    goal_type:    document.getElementById('goal-type').value,
    limit_amount: parseFloat(document.getElementById('goal-limit').value),
    current_spend:parseFloat(document.getElementById('goal-spend').value)||0,
    period:       document.getElementById('goal-period').value,
    is_active:    true,
  }).select().single();
  btn.disabled=false; btn.textContent='Add Goal';
  if (error) { err.textContent=error.message; err.classList.remove('hidden'); return; }
  goals=[data,...goals]; renderGoals();
  document.getElementById('goals-form').reset();
};

window.removeGoal = async function(id) {
  await supabaseClient.from('goals').update({is_active:false}).eq('id',id).eq('user_id',userId);
  goals=goals.filter(g=>g.id!==id); renderGoals();
};

window.signOut = async function() { await logout(); };

// Auto-refresh after successful upload
const _origFetch = window.fetch.bind(window);
window.fetch = async function(...args) {
  const res = await _origFetch(...args);
  const url = typeof args[0]==='string' ? args[0] : '';
  if (url.includes('/api/audit')) {
    res.clone().json().then(d => { if (d?.success) setTimeout(reloadData, 800); }).catch(()=>{});
  }
  return res;
};

async function reloadData() {
  const { data:a } = await supabaseClient.from('audits').select('*').eq('user_id',userId).eq('status','complete').order('created_at',{ascending:false}).limit(1);
  latestAudit = a?.[0] || null;
  if (latestAudit) {
    transactions = await fetchAllTransactions(latestAudit.id);
  }
  renderOverview(); renderCashFlow(); renderBalanceSheet(); renderLedger(); renderTaxDashboard();
  renderAuditTab();
}

// ── INIT ─────────────────────────────────────────────────────────────────────
async function init() {
  const user = await requireAuth();
  if (!user) return;
  userId = user.id;
  const { data:{ session } } = await supabaseClient.auth.getSession();
  accessToken = session?.access_token || '';

  const [prof, auditRes, goalsRes] = await Promise.all([
    getProfile(userId),
    supabaseClient.from('audits').select('*').eq('user_id',userId).eq('status','complete').order('created_at',{ascending:false}).limit(1),
    supabaseClient.from('goals').select('*').eq('user_id',userId).eq('is_active',true).order('created_at',{ascending:false}),
  ]);

  document.getElementById('nav-name').textContent = prof?.full_name || user.email || '—';
  latestAudit = auditRes.data?.[0] || null;
  goals       = goalsRes.data || [];

  if (latestAudit) {
    transactions = await fetchAllTransactions(latestAudit.id);
  }

  document.getElementById('skeleton').classList.add('hidden');
  document.getElementById('tab-overview').classList.remove('hidden');

  renderOverview();
  renderAuditTab();
  renderCashFlow();
  renderBalanceSheet();
  renderLedger();
  renderTaxDashboard();
  renderGoals();
}

init();
</script>
