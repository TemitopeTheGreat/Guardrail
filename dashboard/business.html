<!DOCTYPE html>
<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }

  body::before {

</head>
<body class="bg-slate-950 text-slate-300 min-h-screen">

<!-- ── NAV ─────────────────────────────────────────────────────────────────── -->
<nav class="sticky top-0 z-50 bg-slate-950/95 backdrop-blur-lg border-b border-slate-800/60">

    <div class="flex-1 flex items-stretch overflow-x-auto">
      <button data-tab="overview"  onclick="switchTab('overview')"  class="tab-btn tab-active  px-4 text-sm font-semibold whitespace-nowrap transition-colors">Overview</button>

<script type="module">
import { supabaseClient, requireAuth, getProfile, logout } from '/js/auth.js';

let userId, accessToken;
let latestAudit  = null;
let transactions = [];
let goals        = [];
let stations     = [];
let vatRecords   = [];

// ── FORMATTERS ───────────────────────────────────────────────────────────────
function formatNGN(n) {
  const v = Number(n);
  if (!isFinite(v)) return 'NGN 0.00';
  return 'NGN ' + v.toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function scoreHex(s) { return +s>=90?'#34D399':+s>=70?'#FBBF24':'#F87171'; }
function scoreCls(s) { return +s>=90?'text-emerald-400':+s>=70?'text-amber-400':'text-red-400'; }
function fmtDate(d) { try { return new Date(d).toLocaleDateString('en-GB'); } catch { return d||'—'; } }
function monthLabel(ym) { const [y,m]=ym.split('-'); return new Date(+y,+m-1).toLocaleDateString('en-GB',{month:'short',year:'numeric'}); }

// ── P&L CATEGORIES ────────────────────────────────────────────────────────────
const REV_CATS        = new Set(['income']);
const COST_SALES_CATS = new Set(['purchases','fuel','logistics']);
// Operating expenses: salary, rent, utilities, telecoms, tax, other (everything else debit)

// ── EMPTY STATE ───────────────────────────────────────────────────────────────
function emptyState(msg='No audit data yet', sub='Upload your first transaction file to get started') {
  return `<div class="flex flex-col items-center justify-center py-20 text-center">
    <svg class="mb-5 opacity-20" width="56" height="56" fill="none" viewBox="0 0 56 56">
      <rect x="8" y="14" width="40" height="32" rx="4" stroke="#4F46E5" stroke-width="2"/>
      <path d="M20 28h16M20 35h10" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <p class="text-white font-bold text-xl mb-2">${msg}</p>
    <p class="text-slate-500 text-sm mb-6 max-w-xs">${sub}</p>
    <button onclick="switchTab('audit')" class="bg-indigo-500 hover:bg-indigo-400 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition-colors">Upload first file</button>
  </div>`;
}

// ── TAB SWITCHING ─────────────────────────────────────────────────────────────
window.switchTab = function(name) {
  document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('hidden'));
  document.getElementById('tab-'+name)?.classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const on = btn.dataset.tab === name;
    btn.className = `tab-btn ${on?'tab-active':'tab-inactive'} px-4 text-sm font-semibold whitespace-nowrap transition-colors`;
  });
};

// ── DATA HELPERS ──────────────────────────────────────────────────────────────
// Fetch every transaction row for an audit — Supabase caps a single select at
// 1000 rows, so page through with .range() until a short page tells us we're done.
// (No row limit per the audit spec — large uploads must show their full ledger.)
async function fetchAllTransactions(auditId) {
  const PAGE = 1000;
  let all = [], from = 0;
  for (;;) {
    const { data } = await supabaseClient.from('transactions').select('*')
      .eq('audit_id', auditId).order('row_number').range(from, from + PAGE - 1);
    all = all.concat(data || []);
    if (!data || data.length < PAGE) break;
    from += PAGE;
  }
  return all;
}

function computeTotals(txns) {
  const clean   = txns.filter(t => !t.is_flagged);
  const revenue = clean.filter(t => Number(t.credit) > 0 && (t.financial_type === 'revenue' || !t.financial_type))
                       .reduce((s,t) => s + Number(t.credit||0), 0);
  const costs   = clean.filter(t => Number(t.debit)  > 0 && (t.financial_type === 'expense' || !t.financial_type))
                       .reduce((s,t) => s + Number(t.debit||0), 0);
  const profit  = revenue - costs;
  const margin  = revenue > 0 ? ((profit / revenue) * 100) : 0;
  return { revenue, costs, profit, margin };
}
function groupByDebitCat(txns) {
  const m={};
  txns.filter(t=>!t.is_flagged&&Number(t.debit)>0).forEach(t=>{m[t.category||'other']=(m[t.category||'other']||0)+Number(t.debit);});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

// ── UI PRIMITIVES ─────────────────────────────────────────────────────────────
function metricCard(label,val,cls='text-white',sub='') {
  return `<div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
    <p class="text-xs uppercase tracking-widest text-slate-500 mb-3">${label}</p>
    <p class="text-2xl font-bold mono ${cls}">${val}</p>
    ${sub?`<p class="text-xs text-slate-600 mt-1 truncate">${sub}</p>`:''}
  </div>`;
}
function catBars(entries, total, col='#34D399') {
  if (!entries.length) return '<p class="text-slate-600 text-sm">No data</p>';
  const max=entries[0][1];
  return entries.map(([cat,amt])=>{
    const pct=total>0?((amt/total)*100).toFixed(1):0;
    const w  =max>0 ?((amt/max)*100).toFixed(1):0;
    return `<div class="mb-3">
      <div class="flex justify-between text-xs mb-1.5">
        <span class="text-slate-300 font-medium capitalize">${cat}</span>
        <span class="mono text-slate-400">${formatNGN(amt)} <span class="text-slate-600">${pct}%</span></span>
      </div>
      <div class="bg-slate-800 rounded-full h-1.5">
        <div style="width:${w}%;background:${col}" class="h-1.5 rounded-full transition-all duration-500"></div>
      </div>
    </div>`;
  }).join('');
}
function plLine(label,val,cls='text-slate-300',bold=false) {
  return `<div class="flex justify-between items-center py-2.5 border-b border-slate-800/50">
    <span class="${bold?'text-white font-semibold':'text-slate-400'} text-sm">${label}</span>
    <span class="mono text-sm font-${bold?'bold':'medium'} ${cls}">${formatNGN(val)}</span>
  </div>`;
}

// ── RENDER: OVERVIEW ─────────────────────────────────────────────────────────
function renderOverview() {
  const { revenue, costs, profit, margin } = computeTotals(transactions);

  const score = Number(latestAudit?.audit_score || 0);
  document.getElementById('overview-cards').innerHTML = !latestAudit
    ? metricCard('Total Revenue','—')+metricCard('Total Expenses','—')+metricCard('Net Profit','—')+metricCard('Audit Score','—')
    : metricCard('Total Revenue',  formatNGN(revenue),        'text-emerald-400')
    + metricCard('Total Expenses', formatNGN(costs),          'text-red-400')
    + metricCard(profit>=0?'Net Profit':'Net Loss', formatNGN(profit), profit>=0?'text-emerald-400':'text-red-400')
    + metricCard('Audit Score',    `${score}/100`,             scoreCls(score), latestAudit?.file_name||'');

  // Revenue vs costs bars
  const barsEl = document.getElementById('rev-cost-bars');
  if (!latestAudit) { barsEl.innerHTML = emptyState('No data yet',''); return; }
  const max = Math.max(revenue, costs, 1);
  barsEl.innerHTML = `<p class="text-slate-400 text-xs uppercase tracking-widest font-semibold mb-5">Revenue vs Costs</p>
    <div class="space-y-4">
      <div>
        <div class="flex justify-between text-xs mb-1.5 text-slate-400"><span>Revenue</span><span class="mono text-emerald-400">${formatNGN(revenue)}</span></div>
        <div class="bg-slate-800 rounded-full h-2"><div style="width:${((revenue/max)*100).toFixed(1)}%;background:#34D399" class="h-2 rounded-full transition-all duration-500"></div></div>
      </div>
      <div>
        <div class="flex justify-between text-xs mb-1.5 text-slate-400"><span>Costs</span><span class="mono text-red-400">${formatNGN(costs)}</span></div>
        <div class="bg-slate-800 rounded-full h-2"><div style="width:${((costs/max)*100).toFixed(1)}%;background:#F87171" class="h-2 rounded-full transition-all duration-500"></div></div>
      </div>
    </div>`;

  // Top expenses
  const expEl = document.getElementById('biz-expenses');
  expEl.innerHTML = `<p class="text-slate-400 text-xs uppercase tracking-widest font-semibold mb-5">Business Expenses</p>`
    + catBars(groupByDebitCat(transactions), costs, '#F87171');

  // Recent transactions
  const recent = [...transactions].sort((a,b)=>(b.row_number||0)-(a.row_number||0)).slice(0,10);
  const recEl  = document.getElementById('recent-txns');
  recEl.innerHTML = `<p class="text-slate-400 text-xs uppercase tracking-widest font-semibold mb-5">Recent Transactions</p>
    <div class="overflow-x-auto"><table class="w-full text-sm">
      <thead><tr class="border-b border-slate-800">
        <th class="text-left pb-3 text-xs text-slate-500 font-semibold uppercase tracking-wider pr-4">Date</th>
        <th class="text-left pb-3 text-xs text-slate-500 font-semibold uppercase tracking-wider pr-4">Description</th>
        <th class="text-left pb-3 text-xs text-slate-500 font-semibold uppercase tracking-wider pr-4">Category</th>
        <th class="text-right pb-3 text-xs text-slate-500 font-semibold uppercase tracking-wider pr-4">Amount</th>
        <th class="text-right pb-3 text-xs text-slate-500 font-semibold uppercase tracking-wider">Type</th>
      </tr></thead><tbody>
      ${recent.map(t=>{
        const dr=Number(t.debit)>0; const am=dr?Number(t.debit):Number(t.credit);

// ── RENDER: P&L ───────────────────────────────────────────────────────────────
function renderPL() {
  const el = document.getElementById('pl-content');
  if (!latestAudit) { el.innerHTML = emptyState(); return; }

  const clean  = transactions.filter(t => !t.is_flagged);
  // Revenue: credits with financial_type = 'revenue' (or unclassified credits)
  const allRev   = clean.filter(t => Number(t.credit) > 0 && (t.financial_type === 'revenue' || !t.financial_type));
  const revByCat = {};
  allRev.forEach(t => { revByCat[t.category||'income'] = (revByCat[t.category||'income']||0) + Number(t.credit); });
  const totalRev = Object.values(revByCat).reduce((s,v) => s+v, 0);

  // Cost of sales: expense transactions in cost-of-sales categories
  const cosByCat = {};
  clean.filter(t => Number(t.debit) > 0 && (t.financial_type === 'expense' || !t.financial_type) && COST_SALES_CATS.has(t.category||''))
       .forEach(t => { cosByCat[t.category||''] = (cosByCat[t.category||'']||0) + Number(t.debit); });
  const totalCos    = Object.values(cosByCat).reduce((s,v) => s+v, 0);
  const grossProfit = totalRev - totalCos;
  const grossMargin = totalRev > 0 ? ((grossProfit/totalRev)*100).toFixed(1) : '0.0';

  // Operating expenses: expense transactions NOT in cost-of-sales
  const opexByCat = {};
  clean.filter(t => Number(t.debit) > 0 && (t.financial_type === 'expense' || !t.financial_type) && !COST_SALES_CATS.has(t.category||''))
       .forEach(t => { opexByCat[t.category||'other'] = (opexByCat[t.category||'other']||0) + Number(t.debit); });
  const totalOpex = Object.values(opexByCat).reduce((s,v) => s+v, 0);
  const netProfit = grossProfit - totalOpex;

  el.innerHTML = `<div class="max-w-2xl space-y-5">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
      <p class="text-slate-400 text-xs uppercase tracking-widest font-semibold mb-4">Revenue</p>
      ${Object.entries(revByCat).map(([c,v])=>plLine(c.charAt(0).toUpperCase()+c.slice(1),v)).join('')}
      <div class="flex justify-between items-center pt-3 mt-1">
        <span class="text-white font-bold text-sm">Total Revenue</span>
        <span class="mono font-bold text-emerald-400 text-sm">${formatNGN(totalRev)}</span>
      </div>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
      <p class="text-slate-400 text-xs uppercase tracking-widest font-semibold mb-4">Cost of Sales</p>
      ${Object.entries(cosByCat).map(([c,v])=>plLine(c.charAt(0).toUpperCase()+c.slice(1),v,'text-red-400')).join('')
        || '<p class="text-slate-600 text-sm py-2">No direct cost transactions</p>'}
      <div class="flex justify-between items-center pt-3 mt-1">
        <span class="text-white font-bold text-sm">Total Cost of Sales</span>
        <span class="mono font-bold text-red-400 text-sm">${formatNGN(totalCos)}</span>
      </div>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
      <div class="flex justify-between items-center mb-1">
        <span class="text-white font-black text-xl">Gross Profit</span>
        <span class="mono font-black text-2xl ${grossProfit>=0?'text-emerald-400':'text-red-400'}">${formatNGN(grossProfit)}</span>
      </div>
      <p class="text-slate-500 text-xs mono">Gross margin: ${grossMargin}%</p>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
      <p class="text-slate-400 text-xs uppercase tracking-widest font-semibold mb-4">Operating Expenses</p>
      ${Object.entries(opexByCat).map(([c,v])=>plLine(c.charAt(0).toUpperCase()+c.slice(1),v,'text-red-400')).join('')
        || '<p class="text-slate-600 text-sm py-2">No operating expense transactions</p>'}
      <div class="flex justify-between items-center pt-3 mt-1">
        <span class="text-white font-bold text-sm">Total Operating Expenses</span>
        <span class="mono font-bold text-red-400 text-sm">${formatNGN(totalOpex)}</span>
      </div>
    </div>
    <div class="bg-slate-900 border ${netProfit>=0?'border-emerald-500/30':'border-red-500/30'} rounded-xl p-8 text-center">
      <p class="text-slate-500 text-xs uppercase tracking-widest font-semibold mb-3">${netProfit>=0?'Net Profit':'Net Loss'}</p>
      <p class="text-5xl font-black mono mb-3 ${netProfit>=0?'text-emerald-400':'text-red-400'}">${formatNGN(Math.abs(netProfit))}</p>
      <button onclick="dlReport('${latestAudit.id}')"
        class="inline-flex items-center gap-2 bg-indigo-500 hover:bg-indigo-400 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition-colors">
        ↓ Export P&amp;L
      </button>
    </div>
  </div>`;
}

window.calcVAT = function() {
  const VAT_RATE = window.GuardrailTax.VAT_RATE;
  const sales     = parseFloat(document.getElementById('vat-sales').value)     || 0;
  const purchases = parseFloat(document.getElementById('vat-purchases').value) || 0;
  const outVat = sales     * VAT_RATE;
  const inVat  = purchases * VAT_RATE;
  const net    = outVat - inVat;
  document.getElementById('vat-out').textContent = formatNGN(outVat);
  document.getElementById('vat-in').textContent  = formatNGN(inVat);
  document.getElementById('vat-net').textContent = formatNGN(net);
  document.getElementById('vat-net').className   = `mono ${net>=0?'text-indigo-400':'text-emerald-400'}`;
};

window.saveVAT = async function() {
  const VAT_RATE = window.GuardrailTax.VAT_RATE;
  const sales     = parseFloat(document.getElementById('vat-sales').value)     || 0;
  const purchases = parseFloat(document.getElementById('vat-purchases').value) || 0;
  const label     = document.getElementById('vat-period-label').value.trim() || new Date().toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const errEl     = document.getElementById('vat-err');
  errEl.classList.add('hidden');

  const now   = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  const end   = new Date(now.getFullYear(), now.getMonth()+1, 0);

  const { error } = await supabaseClient.from('vat_records').insert({
    user_id:       userId,
    period_label:  label,
    period_start:  start.toISOString().slice(0,10),
    period_end:    end.toISOString().slice(0,10),
    output_vat:    sales     * VAT_RATE,
    input_vat:     purchases * VAT_RATE,
    filing_status: 'draft',
  });
  if (error) { errEl.textContent=error.message; errEl.classList.remove('hidden'); return; }
  renderVAT();
};

function renderTaxDashboard() {
  // Unlike the other tabs, this one patches several fixed-id sub-panels
  // (taxDisclaimer, vatComputation, etc.) in place rather than rebuilding

  if (!latestAudit || !transactions.length) {
    const empty = emptyState('No tax data yet', 'Upload transactions to see tax estimates');

    const { revenue: income, costs: expenses } = computeTotals(transactions);
    const cit = window.GuardrailTax.computeCIT(income, expenses);
    const html = `
      <table class="w-full text-sm">

        <thead><tr class="border-b border-slate-700 text-xs text-slate-500"><th class="text-left py-2">Category</th><th class="text-right">Amount</th><th class="text-right">Rate</th><th class="text-right">WHT Due</th></tr></thead>

        <td class="py-3 px-4 text-sm text-indigo-400 font-semibold">${item.authority}</td>
      </tr>
    `).join('');
    const html = `
      <table class="w-full text-sm">
        <thead class="border-b border-slate-700 bg-slate-800/50"><tr><th class="text-left py-3 px-4 text-xs font-bold text-slate-400 uppercase">Deadline</th><th class="text-left py-3 px-4 text-xs font-bold text-slate-400 uppercase">Obligation</th><th class="text-left py-3 px-4 text-xs font-bold text-slate-400 uppercase">Law</th><th class="text-left py-3 px-4 text-xs font-bold text-slate-400 uppercase">Authority</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
    const calEl = document.getElementById('taxCalendar');
    if (calEl) calEl.innerHTML = html;
  }
}

// ── RENDER: STATIONS ─────────────────────────────────────────────────────────
function renderStations() {
  const el = document.getElementById('stations-list');
  if (!stations.length) {
    el.innerHTML = `<div class="bg-slate-900 border border-slate-800 rounded-xl p-8 text-center"><p class="text-slate-500 text-sm">No active stations. Add one below.</p></div>`;
    return;
  }
  el.innerHTML = `<p class="text-slate-400 text-xs uppercase tracking-widest font-semibold mb-5">Active Stations</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      ${stations.map(s=>{
        const bud  = Number(s.monthly_budget);
        const spd  = Number(s.actual_spend);
        const vari = bud - spd;
        const pct  = bud>0 ? Math.min((spd/bud)*100,100) : 0;
        const over = spd > bud;
        const bc   = pct>=100?'#F87171':pct>=80?'#FBBF24':'#34D399';
        return `<div class="bg-slate-900 border ${over?'border-red-500/40':'border-slate-800'} rounded-xl p-5">
          <div class="flex justify-between items-start mb-3">
            <div>
              <p class="text-white font-semibold text-sm mb-0.5">${s.station_name}</p>
              ${s.station_code?`<span class="mono text-xs text-slate-500">${s.station_code}</span>`:''}
            </div>
            <button onclick="removeStation('${s.id}')" class="text-slate-600 hover:text-red-400 transition-colors text-xl leading-none">×</button>
          </div>
          <div class="flex justify-between text-xs text-slate-500 mb-1.5">
            <span>Spend: <span class="mono ${over?'text-red-400':'text-slate-300'}">${formatNGN(spd)}</span></span>
            <span>Budget: <span class="mono text-slate-300">${formatNGN(bud)}</span></span>
          </div>
          <div class="bg-slate-800 rounded-full h-1.5 mb-3"><div style="width:${pct.toFixed(1)}%;background:${bc}" class="h-1.5 rounded-full transition-all duration-500"></div></div>
          <div class="flex justify-between text-xs mb-4">
            <span class="${vari>=0?'text-emerald-400':'text-red-400'} font-semibold">Variance: ${formatNGN(vari)}</span>
            <span class="text-slate-600">${pct.toFixed(0)}% used</span>
          </div>
          <div class="flex gap-2">
            <input id="spd-${s.id}" type="number" min="0" step="0.01" placeholder="New spend"
              class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-xs mono outline-none focus:border-indigo-400 transition-colors"
              value="${spd}">
            <button onclick="updateSpend('${s.id}')"
              class="bg-indigo-500 hover:bg-indigo-400 text-white text-xs font-bold px-3 py-2 rounded-lg transition-colors">
              Update
            </button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

window.handleAddStation = async function(e) {
  e.preventDefault();
  const btn = document.getElementById('stn-submit-btn');
  const err = document.getElementById('stn-err');
  err.classList.add('hidden'); btn.disabled=true; btn.textContent='Saving…';
  const { data, error } = await supabaseClient.from('stations').insert({
    user_id:        userId,
    station_name:   document.getElementById('stn-name').value.trim(),
    station_code:   document.getElementById('stn-code').value.trim()||null,
    monthly_budget: parseFloat(document.getElementById('stn-budget').value),
    actual_spend:   0,
    is_active:      true,
  }).select().single();
  btn.disabled=false; btn.textContent='Add Station';
  if (error) { err.textContent=error.message; err.classList.remove('hidden'); return; }
  stations=[data,...stations]; renderStations();
  document.getElementById('station-form').reset();
};

window.updateSpend = async function(id) {
  const val = parseFloat(document.getElementById('spd-'+id)?.value) || 0;
  const { data, error } = await supabaseClient.from('stations').update({actual_spend:val}).eq('id',id).eq('user_id',userId).select().single();
  if (!error && data) { stations=stations.map(s=>s.id===id?data:s); renderStations(); }
};

window.removeStation = async function(id) {
  await supabaseClient.from('stations').update({is_active:false}).eq('id',id).eq('user_id',userId);
  stations=stations.filter(s=>s.id!==id); renderStations();
};

// ── RENDER: GOALS ─────────────────────────────────────────────────────────────
function renderGoals() {
  const el = document.getElementById('goals-list');
  if (!goals.length) {
    el.innerHTML = `<div class="bg-slate-900 border border-slate-800 rounded-xl p-8 text-center"><p class="text-slate-500 text-sm">No active goals. Add one below.</p></div>`;
    return;
  }
  el.innerHTML = `<p class="text-slate-400 text-xs uppercase tracking-widest font-semibold mb-5">Active Goals</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      ${goals.map(g=>{
        const lim=Number(g.limit_amount),spd=Number(g.current_spend);
        const pct=lim>0?Math.min((spd/lim)*100,100):0;
        const over=spd>lim;
        const bc=pct>=100?'#F87171':pct>=80?'#FBBF24':'#34D399';
        const tl={expense_cap:'Expense Cap',savings_target:'Savings Target',revenue_target:'Revenue Target',profit_buffer:'Profit Buffer'}[g.goal_type]||g.goal_type;
        return `<div class="bg-slate-900 border ${over?'border-red-500/50':'border-slate-800'} rounded-xl p-5">
          <div class="flex justify-between items-start mb-3">
            <div><p class="text-white font-semibold text-sm mb-1">${g.label}</p>
              <span class="text-xs mono px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">${tl}</span></div>
            <button onclick="removeGoal('${g.id}')" class="text-slate-600 hover:text-red-400 transition-colors text-xl leading-none ml-2">×</button>
          </div>
          ${over?`<div class="bg-red-900/20 border border-red-500/30 rounded-lg px-3 py-2 mb-3"><p class="text-red-400 text-xs font-semibold">Guardrail breached by ${formatNGN(spd-lim)}</p></div>`:''}
          <div class="flex justify-between text-xs text-slate-500 mb-1.5"><span class="mono">${formatNGN(spd)}</span><span class="mono">${formatNGN(lim)}</span></div>
          <div class="bg-slate-800 rounded-full h-1.5 mb-2"><div style="width:${pct.toFixed(1)}%;background:${bc}" class="h-1.5 rounded-full transition-all duration-500"></div></div>
          <div class="flex justify-between text-xs text-slate-600"><span>${pct.toFixed(0)}% used</span><span class="capitalize">${g.period}</span></div>
        </div>`;
      }).join('')}
    </div>`;
}

window.handleAddGoal = async function(e) {
  e.preventDefault();
  const btn=document.getElementById('goals-submit-btn'), err=document.getElementById('goal-err');
  err.classList.add('hidden'); btn.disabled=true; btn.textContent='Saving…';
  const { data, error } = await supabaseClient.from('goals').insert({
    user_id:      userId,
    label:        document.getElementById('goal-label').value.trim(),
    goal_type:    document.getElementById('goal-type').value,
    limit_amount: parseFloat(document.getElementById('goal-limit').value),
    current_spend:parseFloat(document.getElementById('goal-spend').value)||0,
    period:       document.getElementById('goal-period').value,
    is_active:    true,
  }).select().single();
  btn.disabled=false; btn.textContent='Add Goal';
  if (error) { err.textContent=error.message; err.classList.remove('hidden'); return; }
  goals=[data,...goals]; renderGoals();
  document.getElementById('goals-form').reset();
};

window.removeGoal = async function(id) {
  await supabaseClient.from('goals').update({is_active:false}).eq('id',id).eq('user_id',userId);
  goals=goals.filter(g=>g.id!==id); renderGoals();
};

window.signOut = async function() { await logout(); };

// Auto-refresh after upload
const _origFetch = window.fetch.bind(window);
window.fetch = async function(...args) {
  const res = await _origFetch(...args);
  const url = typeof args[0]==='string'?args[0]:'';
  if (url.includes('/api/audit')) {
    res.clone().json().then(d=>{ if(d?.success) setTimeout(reloadData,800); }).catch(()=>{});
  }
  return res;
};

async function reloadData() {
  const { data:a } = await supabaseClient.from('audits').select('*').eq('user_id',userId).eq('status','complete').order('created_at',{ascending:false}).limit(1);
  latestAudit = a?.[0]||null;
  if (latestAudit) {
    transactions = await fetchAllTransactions(latestAudit.id);
  }
  renderOverview(); renderPL(); renderLedger(); renderTaxDashboard(); renderAuditTab();
}

// ── INIT ─────────────────────────────────────────────────────────────────────
async function init() {
  const user = await requireAuth();
  if (!user) return;
  userId = user.id;
  const { data:{session} } = await supabaseClient.auth.getSession();
  accessToken = session?.access_token||'';

  const [prof, auditRes, goalsRes, stationsRes] = await Promise.all([
    getProfile(userId),
    supabaseClient.from('audits').select('*').eq('user_id',userId).eq('status','complete').order('created_at',{ascending:false}).limit(1),
    supabaseClient.from('goals').select('*').eq('user_id',userId).eq('is_active',true).order('created_at',{ascending:false}),
    supabaseClient.from('stations').select('*').eq('user_id',userId).eq('is_active',true).order('created_at',{ascending:false}),
  ]);

  document.getElementById('nav-name').textContent = prof?.full_name||user.email||'—';
  if (prof?.business_name) document.getElementById('nav-bizname').textContent = prof.business_name.toUpperCase();

  latestAudit = auditRes.data?.[0]||null;
  goals       = goalsRes.data||[];
  stations    = stationsRes.data||[];

  if (latestAudit) {
    transactions = await fetchAllTransactions(latestAudit.id);
  }

  document.getElementById('skeleton').classList.add('hidden');
  document.getElementById('tab-overview').classList.remove('hidden');

  renderOverview();
  renderAuditTab();
  renderPL();
  renderVAT();
  renderLedger();
  renderTaxDashboard();
  renderStations();
  renderGoals();
}

init();
</script>
</body>
